# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 6  # 类别数目，nc代表"number of classes"，即模型用于检测的对象类别总数。
scales: # 模型复合缩放常数，例如 'model=yolov8n.yaml' 将调用带有 'n' 缩放的 yolov8.yaml
  # [depth, width, max_channels]  
  # depth： 表示深度因子，用来控制一些特定模块的数量的，模块数量多网络深度就深；
  # width： 表示宽度因子，用来控制整个网络结构的通道数量，通道数量越多，网络就看上去更胖更宽；
  # max_channels： 最大通道数，为了动态地调整网络的复杂性。
  # 在 YOLO 的早期版本中，网络中的每个层都是固定的，这意味着每个层的通道数也是固定的。但在 YOLOv8 中，为了增加网络的灵活性并使其能够更好地适应不同的任务和数据集，引入了 max_channels 参数

  n: [0.33, 0.25, 1024]  # YOLOv8n概览：225层, 3157200参数, 3157184梯度, 8.9 GFLOPs
  s: [0.33, 0.50, 1024]  # YOLOv8s概览：225层, 11166560参数, 11166544梯度, 28.8 GFLOPs
  m: [0.67, 0.75, 768]   # YOLOv8m概览：295层, 25902640参数, 25902624梯度, 79.3 GFLOPs
  l: [1.00, 1.00, 512]   # YOLOv8l概览：365层, 43691520参数, 43691504梯度, 165.7 GFLOPs
  x: [1.00, 1.25, 512]   # YOLOv8x概览：365层, 68229648参数, 68229632梯度, 258.5 GFLOPs

# p几相当于在下采样过程中 特征图是原来的几分之一，并且注释了层数。
# YOLOv8.0n backbone 骨干层
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0
  - [-1, 1, Conv, [128, 3, 2]]   # 1
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7
  - [-1, 3, C2f, [1024, True]]  # 8
  - [-1, 1, SPPF, [1024, 5]]  # 9 

# YOLOv8.0n head 头部层
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 第10层，
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4 第11层，
  - [-1, 3, C2f, [512]]  # 12 

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 第13层，
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3 第14层，
  - [-1, 3, C2f, [256]]  # 15 (P3/8-small) 第15层，
  - [-1, 1,DomainClassify,[1]] #16


  - [-1, 1, Conv, [256, 3, 2]] # 第17层，
  - [[-1, 12], 1, Concat, [1]]  # cat head P4 第18层，
  - [-1, 3, C2f, [512]]  #  (P4/16-medium) 第19层，
  - [-1, 1,DomainClassify,[1]] # 20


  - [-1, 1, Conv, [512, 3, 2]] # 第21层，
  - [[-1, 9], 1, Concat, [1]]  # cat head P5 第22层，
  - [-1, 3, C2f, [1024]]  # 21 (P5/32-large) 第23层
  - [-1, 1,ClasDomainClassifysifyy,[1]]  # 24


  # - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5) 第20层，
  - [[15, 19, 23], 1, Detect, [nc]]  # Detect(P3, P4, P5) 第20层，
